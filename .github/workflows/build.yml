name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter create --project-name spongebob_cleaner --platforms=macos .
      - run: mkdir -p assets
      - run: flutter pub get
      - run: flutter build macos --release
      - run: |
          cd build/macos/Build/Products/Release
          zip -r "SpongeBob-by-GM-macOS.zip" "SpongeBob by GM.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: build/macos/Build/Products/Release/SpongeBob-by-GM-macOS.zip

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configure Flutter
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: Scaffold Windows & Ensure Assets Directory
        shell: pwsh
        run: |
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          flutter create --project-name spongebob_cleaner --platforms=windows .
          if (-not (Test-Path assets)) { New-Item -ItemType Directory -Path assets }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        shell: cmd
        run: flutter build windows --release

      - name: Compress Windows Build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "SpongeBob-by-GM-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "SpongeBob-by-GM-Windows.zip"

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/macOS/SpongebobCleaner-macOS.zip
            artifacts/windows/SpongebobCleaner-Windows.zip
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
