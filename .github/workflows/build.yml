name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter create --project-name spongebob_cleaner --platforms=macos .
      - run: flutter pub get
      - run: flutter build macos --release
      - run: |
          cd build/macos/Build/Products/Release
          zip -r SpongebobCleaner-macOS.zip *.app
      - uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: build/macos/Build/Products/Release/SpongebobCleaner-macOS.zip

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # 1. Setup official Microsoft MSBuild & Visual Studio registration
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 2. Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 3. Explicitly tell Flutter where Visual Studio 2022 is located
      - name: Configure Flutter
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      # 4. Generate native Windows files for the detected environment
      - name: Scaffold Windows
        shell: pwsh
        run: |
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          flutter create --project-name spongebob_cleaner --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      # 5. Build Windows App
      - name: Build Windows
        shell: cmd
        run: flutter build windows --release

      # 6. Archive and upload
      - name: Compress Windows Build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath SpongebobCleaner-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SpongebobCleaner-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: |
            artifacts/macOS/SpongebobCleaner-macOS.zip
            artifacts/windows/SpongebobCleaner-Windows.zip
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
